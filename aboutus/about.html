<section class="arch_contact_us_duplicate" id="contact">

    <div class="responsive-container-block big-container">

        <div class="responsive-container-block container">

            <!-- LEFT CONTENT -->
            <div class="responsive-cell-block wk-mobile-12 wk-desk-5 wk-tab-10 wk-ipadp-5" id="ih6s">

                <p class="text-blk section-head">
                    Let's Connect
                </p>

                <p class="text-blk section-subhead">
                    Have a project idea, collaboration opportunity,
                    or just want to connect? Feel free to reach out.
                    I'm always open to discussing new opportunities
                    and innovative ideas.
                </p>

            </div>


            <!-- RIGHT FORM -->
            <div class="responsive-cell-block wk-ipadp-6 wk-mobile-12 wk-desk-5 wk-tab-9" id="i6df">

                <div class="form-wrapper">

                    <form id="contactForm">

                        <!-- NAME -->
                        <input
                            class="input input-element"
                            type="text"
                            name="Name"
                            placeholder="Your Name"
                            required
                        >

                        <!-- CONTACT NUMBER -->
                        <input
                            class="input input-element"
                            type="tel"
                            name="Contact Number"
                            placeholder="Contact Number"
                        >

                        <!-- EMAIL -->
                        <input
                            class="input input-element"
                            type="email"
                            name="Email"
                            placeholder="Your Email"
                            required
                        >

                        <!-- MESSAGE -->
                        <textarea
                            class="textinput input-element"
                            name="Message"
                            placeholder="Write your message..."
                            required
                        ></textarea>

                        <!-- BUTTON -->
                        <button
                            type="submit"
                            class="button"

                            Send Message
                        </button>

                    </form>

                </div>

<!-- FORM HANDLER -->
<script>

    const contactForm = document.getElementById("contactForm");

    contactForm.addEventListener("submit", function(event) {

        event.preventDefault();

        alert("Thank you! Your message has been submitted.");

        contactForm.reset();

    });

</script>
